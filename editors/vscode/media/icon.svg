<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="rayGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8d6e5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Hexagonal background -->
  <polygon points="64,8 112,36 112,92 64,120 16,92 16,36" fill="url(#bgGrad)" stroke="#1a5276" stroke-width="2"/>

  <!-- Inner hex highlight -->
  <polygon points="64,16 106,40 106,88 64,112 22,88 22,40" fill="none" stroke="#2980b9" stroke-width="1" opacity="0.5"/>

  <!-- Stylized ray/lightning bolt -->
  <path d="M86 28 L50 66 L56 66 L48 100 L84 58 L76 58 Z" fill="url(#rayGrad)" filter="url(#glow)" opacity="0.9"/>

  <!-- Large RT text -->
  <text x="64" y="82" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="800" fill="url(#textGrad)" filter="url(#shadow)" letter-spacing="2">RT</text>

  <!-- Small accent dot -->
  <circle cx="92" cy="104" r="3" fill="#e94560" opacity="0.6"/>
</svg>
